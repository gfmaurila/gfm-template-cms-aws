name: Deploy by GitFlow Environment
on:
  push:
    branches: [hml, main]
    tags: ['v*.*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  hml:
    if: github.ref == 'refs/heads/hml'
    runs-on: ubuntu-latest
    environment: hml
    steps:
      - uses: actions/checkout@v4
      - run: echo "Generator expands homologation deployment using GitHub Environment secrets/OIDC"
  production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "Generator expands deployment of approved vX.Y.Z.B release to production"
